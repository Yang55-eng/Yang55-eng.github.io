function mercX(lon) { return (lon + 180) / 360; }
/** 纬度 -> 归一化墨卡托 y [0,1]（y 向下） */
function mercY(lat) {
  lat = Math.max(-85.05112878, Math.min(85.05112878, lat));
  const s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
/** 归一化墨卡托 -> 经纬度（用于导出/状态栏显示） */
function mercToLon(nx) { return nx * 360 - 180; }
function mercToLat(ny) {
  const n = Math.PI * (1 - 2 * ny);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
/** 当前缩放级别下整个世界（墨卡托）的像素尺寸 */
function worldPx() { return 256 * Math.pow(2, view.zoom); }
/** 归一化墨卡托坐标 -> 屏幕像素 */
function toScreen(p) {
  const wp = worldPx();
  return [(p[0] - view.cx) * wp + view.w / 2, (p[1] - view.cy) * wp + view.h / 2];
}
/** 屏幕像素 -> 归一化墨卡托坐标 */
function toWorld(sx, sy) {
  const wp = worldPx();
  return [view.cx + (sx - view.w / 2) / wp, view.cy + (sy - view.h / 2) / wp];
}
/** 生成唯一 id */
function uid() { return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
/** 点是否在线段附近的距离（用于折线命中） */
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
  t = clamp(t, 0, 1);
  const qx = x1 + t * dx, qy = y1 + t * dy;
  return Math.hypot(px - qx, py - qy);
}
/** 射线法：点是否在多边形内（屏幕坐标） */
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > py) !== (yj > py) &&
        px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** 颜色 + 透明度 -> rgba 字符串 */
function withAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const f = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const r = parseInt(f.slice(0, 2), 16), g = parseInt(f.slice(2, 4), 16), b = parseInt(f.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ---------------- 2. 底图数据预处理 ----------------
 * 把 BASE_DATA 各层的经纬度几何转成归一化墨卡托数组 m，
 * 并预计算每个要素的包围盒与标签锚点，避免每帧重复投影。 */
const BASE = { layers: {} };
const LAYER_ORDER = ["green", "water", "sports", "path", "roadB", "roadA", "buildings"];

(function prepareBase() {
  for (const key of Object.keys(BASE_DATA.layers)) {
    const feats = BASE_DATA.layers[key].map(f => {
      const isPoi = (key === "pois");
      const src = isPoi ? [f.g] : f.g;
      const m = src.map(pt => [mercX(pt[0]), mercY(pt[1])]);
      let x0 = 9, y0 = 9, x1 = -9, y1 = -9;
      for (const p of m) {
        if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
        if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      }
      return { m, n: f.n || null, t: f.t || null,
               x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
    });
    BASE.layers[key] = feats;
  }
})();

/* 校园边界与校园范围（用于校外压暗 + 默认视角贴合校园） */
(function prepareCampus() {
  if (BASE_DATA.boundary && BASE_DATA.boundary.ring) {
    BASE.boundary = {
      name: BASE_DATA.boundary.name || "校园",
      m: BASE_DATA.boundary.ring.map(p => [mercX(p[0]), mercY(p[1])])
    };
  }
  if (BASE_DATA.campus) {
    const c = BASE_DATA.campus;
    BASE.campus = {
      cx: mercX(c.center[0]), cy: mercY(c.center[1]),
      x0: mercX(c.bbox[0]), y0: mercY(c.bbox[3]),   // 注意纬度方向
      x1: mercX(c.bbox[2]), y1: mercY(c.bbox[1])
    };
  }
})();

/** 在线瓦片底图（可选）：与内嵌矢量底图互斥。OSM 瓦片为 WGS84，与内嵌数据天然对齐 */
const tiles = {
  enabled: false,     // 是否使用在线瓦片
  failed: 0,          // 加载失败计数，超过阈值自动回退矢量底图
  cache: new Map(),   // "z/x/y" -> Image
  pending: 0
};
const TILE_URL = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

/** 取瓦片（带缓存与失败回退） */
function getTile(z, x, y) {
  const key = z + "/" + x + "/" + y;
  let img = tiles.cache.get(key);
  if (img) return img;
  img = new Image();
  img.__ok = false;
  img.onload = () => { img.__ok = true; tiles.pending--; draw(); };
  img.onerror = () => {
    tiles.pending--; tiles.failed++;
    if (tiles.failed >= 4 && tiles.enabled) {
      tiles.enabled = false;
      setStatus("在线底图不可用（可能无网络），已自动切换回内嵌离线矢量底图");
      buildStylePanel(); draw();
    }
  };
  img.crossOrigin = "anonymous";
  img.src = TILE_URL(z, x, y);
  tiles.pending++;
  tiles.cache.set(key, img);
  if (tiles.cache.size > 400) {            // 简单淘汰
    const firstKey = tiles.cache.keys().next().value;
    tiles.cache.delete(firstKey);
  }
  return img;
}

/** 绘制在线瓦片层 */
function drawTiles() {
  const zt = Math.max(3, Math.min(19, Math.floor(view.zoom)));
  const n = Math.pow(2, zt);
  const scale = Math.pow(2, view.zoom - zt);
  const size = 256 * scale;
  const wp = worldPx();
  const originX = view.cx * wp - view.w / 2;
  const originY = view.cy * wp - view.h / 2;
  const tx0 = Math.floor(originX / size), tx1 = Math.floor((originX + view.w) / size);
  const ty0 = Math.floor(originY / size), ty1 = Math.floor((originY + view.h) / size);
  for (let tx = tx0; tx <= tx1; tx++) {
    for (let ty = ty0; ty <= ty1; ty++) {
      if (ty < 0 || ty >= n) continue;
      const wx = ((tx % n) + n) % n;       // 经度方向环绕
      const img = getTile(zt, wx, ty);
      const sx = tx * size - originX, sy = ty * size - originY;
      if (img.__ok) {
        ctx.drawImage(img, sx, sy, size + 0.5, size + 0.5);   // +0.5 消除瓦片缝隙
      } else {
        ctx.fillStyle = style.bg;
        ctx.fillRect(sx, sy, size + 0.5, size + 0.5);
      }
    }
  }
}

/** 切换底图模式 */
function setBasemap(kind) {
  tiles.enabled = (kind === "tiles");
  tiles.failed = 0;
  if (tiles.enabled) setStatus("已切换到在线底图（OpenStreetMap 瓦片）· 断网时会自动回退");
  else setStatus("已切换到内嵌离线矢量底图");
  buildStylePanel();     // 同步下拉框显示
  draw(); save();
}

/** 把视口调整到刚好框住整个校园（带缓动） */
function fitCampus() {
  if (!BASE.campus) return;
  const c = BASE.campus, pad = 36;
  const dx = Math.max(c.x1 - c.x0, 1e-9), dy = Math.max(c.y1 - c.y0, 1e-9);
  const z = Math.log2(Math.min((view.w - pad * 2) / (dx * 256), (view.h - pad * 2) / (dy * 256)));
  animateView({ cx: (c.x0 + c.x1) / 2, cy: (c.y0 + c.y1) / 2, zoom: clamp(z, ZOOM_MIN, ZOOM_MAX) }, 420, "inout");
}

/* ---------------- 3. 全局状态 ---------------- */

/** 预设主题：配色参照主流在线地图（浅色仿 OSM/必应，深色仿夜间导航） */
const THEMES = {
  light: { name: "浅色（默认）",
    bg: "#f3f1ec",
    casing: "#dbd6cc",
    layers: { green: "#d3e8bd", water: "#aacfe3", sports: "#c8ddab",
      roadA: "#fbe7a4", roadB: "#ffffff", path: "#c8c0b1",
      buildings: "#ded6c9", buildingStroke: "#c3b8a6",
      labels: "#3a3a38", pois: "#cf4436" } },
  dark: { name: "深色（夜间）",
    bg: "#1b2430",
    casing: "#141b25",
    layers: { green: "#22382b", water: "#16293c", sports: "#26402f",
      roadA: "#59636f", roadB: "#3f4a57", path: "#48535f",
      buildings: "#2b3441", buildingStroke: "#3e4a58",
      labels: "#e4eaf1", pois: "#ff7b72" } },
  eye: { name: "护眼绿",
    bg: "#eef3e7",
    casing: "#d3dac9",
    layers: { green: "#cfe0bd", water: "#b6d8e0", sports: "#c3ddab",
      roadA: "#f3dfa0", roadB: "#ffffff", path: "#b6bda8",
      buildings: "#dcdccd", buildingStroke: "#bcbda9",
      labels: "#454d40", pois: "#c0453a" } }
};

/** 底图样式状态（可编辑、可持久化） */
const style = {
  theme: "light",
  bg: THEMES.light.bg,
  casing: THEMES.light.casing,
  dim: true,
  layers: {
    green:     { on: true, color: THEMES.light.layers.green,     label: "绿地" },
    water:     { on: true, color: THEMES.light.layers.water,     label: "水系" },
    sports:    { on: true, color: THEMES.light.layers.sports,    label: "运动场" },
    roadA:     { on: true, color: THEMES.light.layers.roadA,     label: "主干道" },
    roadB:     { on: true, color: THEMES.light.layers.roadB,     label: "一般道路" },
    path:      { on: true, color: THEMES.light.layers.path,      label: "步行小径" },
    buildings: { on: true, color: THEMES.light.layers.buildings, label: "建筑" },
    buildingStroke: { on: true, color: THEMES.light.layers.buildingStroke, label: "建筑描边" },
    labels:    { on: true, color: THEMES.light.layers.labels,    label: "文字标注" },
    pois:      { on: true, color: THEMES.light.layers.pois,      label: "兴趣点" }
  }
};

/** 视图状态：中心点（归一化墨卡托）+ 缩放级别 + 画布尺寸 */
const view = {
  cx: mercX(114.3495), cy: mercY(30.4739), // 华农校园中心（首次打开会自动框住整个校园）
  zoom: 14.9, w: 800, h: 600
};
const ZOOM_MIN = 12.5, ZOOM_MAX = 19;

/** 用户要素：标记 / 多边形 / 路线。pts 为归一化墨卡托坐标数组 */
let features = [];
/** 当前工具 */
let tool = "pan";
/** 正在绘制中的多边形/折线顶点 */
let draft = [];
/** 鼠标当前世界坐标（绘制预览用） */
let mouseWorld = null;
/** 选中 / 悬停要素 id */
let selectedId = null, hoverId = null;
/** 拖拽状态 */
let drag = null; // {kind:'pan'|'marker'|'vertex', sx,sy, ox,oy, fid, vidx, moved}
/** 选中要素的建筑信息（底图 hover 提示用） */
let hoverBaseName = "";

/** 是否触屏设备：决定状态栏里给出的操作提示（鼠标 vs 手指） */
const IS_TOUCH = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

const TOOL_HINTS = {
  pan: IS_TOUCH ? "单指拖动平移 · 双指捏合缩放 · 双击放大" : "拖拽平移 · 滚轮缩放 · 双击放大",
  select: IS_TOUCH ? "轻点选中要素 · 拖动顶点改形状 · 点边中点加顶点"
                   : "单击选中要素 · 拖动顶点改形状 · 点边中点加顶点 · 右键顶点删除 · Delete 删要素",
  marker: IS_TOUCH ? "轻点地图放置标记点" : "单击地图放置标记点",
  polygon: IS_TOUCH ? "轻点添加顶点 · 双击或点起点闭合"
                    : "单击添加顶点 · 点击起点或双击闭合 · Esc 取消 · 退格撤销上一点",
  line: IS_TOUCH ? "轻点添加节点 · 双击结束"
                 : "单击添加节点 · 双击结束 · Esc 取消 · 退格撤销上一点"
};

/* ---------------- 4. 要素默认样式 ---------------- */
function defaultStyle(t) {
  if (t === "marker")  return { color: "#e74c3c" };
  if (t === "polygon") return { fill: "#e67e22", fillOpacity: 0.35, stroke: "#d35400", strokeWidth: 2, dash: "" };
  return { color: "#2980b9", width: 3, dash: "" }; // line
}

/* ---------------- 5. 平滑动画（让缩放/平移像真地图一样有过渡） ---------------- */
let anim = null;          // {t0, ms, from, to, ease}
let animRunning = false;

function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

/** 平滑过渡到目标视图。to: {cx, cy, zoom}；ease: 'inout' | 'out' */
function animateView(to, ms, ease) {
  anim = {
    t0: performance.now(),
    ms: ms || 220,
    from: { cx: view.cx, cy: view.cy, zoom: view.zoom },
    to: { cx: to.cx, cy: to.cy, zoom: clamp(to.zoom, ZOOM_MIN, ZOOM_MAX) },
    ease: ease === "inout" ? easeInOutCubic : easeOutCubic
  };
  if (!animRunning) { animRunning = true; requestAnimationFrame(animTick); }
}

function animTick(now) {
  if (!anim) { animRunning = false; return; }
  const t = clamp((now - anim.t0) / anim.ms, 0, 1);
  const k = anim.ease(t);
  view.cx = anim.from.cx + (anim.to.cx - anim.from.cx) * k;
  view.cy = anim.from.cy + (anim.to.cy - anim.from.cy) * k;
  view.zoom = anim.from.zoom + (anim.to.zoom - anim.from.zoom) * k;
  draw();
  if (t >= 1) { anim = null; animRunning = false; save(); }
  else requestAnimationFrame(animTick);
}

/** 中断动画（用户开始拖拽时调用） */
function stopAnim() { anim = null; }

/** 以某个屏幕点为锚点缩放到 nz（锚点下的地物保持不动） */
function zoomAround(sx, sy, nz, ms, ease) {
  const anchor = toWorld(sx, sy);
  const wp = 256 * Math.pow(2, nz);
  animateView({
    cx: anchor[0] - (sx - view.w / 2) / wp,
    cy: anchor[1] - (sy - view.h / 2) / wp,
    zoom: nz
  }, ms, ease);
}

/* ---------------- 6. 画布初始化 ---------------- */
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let dpr = 1;

function resize() {
  const wrap = document.getElementById("mapwrap");
  let w = wrap.clientWidth, h = wrap.clientHeight;
  // 兜底：个别 WebView（微信 / App 内嵌）首次布局还没完成时会给到 0，
  // 若直接用 0 尺寸设置画布，地图就会“一片空白”。这里按视口推算一个合理尺寸。
  if (!w || w < 40) w = Math.max(320, (window.innerWidth || 390) - 60);
  if (!h || h < 40) h = Math.max(240, (window.innerHeight || 720) - 46 - 26);
  view.w = w; view.h = h;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  draw();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 260));
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

/* ---------------- 6. 渲染 ---------------- */

/** 快速视口裁剪：要素包围盒与视口是否相交 */
function inView(f, pad) {
  const wp = worldPx(), p = pad || 0;
  const sx0 = (f.x0 - view.cx) * wp + view.w / 2, sy0 = (f.y0 - view.cy) * wp + view.h / 2;
  const sx1 = (f.x1 - view.cx) * wp + view.w / 2, sy1 = (f.y1 - view.cy) * wp + view.h / 2;
  return sx1 > -p && sx0 < view.w + p && sy1 > -p && sy0 < view.h + p;
}

function drawPolygon(f, fillColor, strokeColor, strokeW) {
  const pts = f.m.map(toScreen);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
  if (strokeColor && strokeW > 0) {
    ctx.strokeStyle = strokeColor; ctx.lineWidth = strokeW; ctx.lineJoin = "round"; ctx.stroke();
  }
}

function drawLine(f, color, width, dash) {
  const pts = f.m.map(toScreen);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(dash === "dash" ? [8, 6] : dash === "dot" ? [2, 5] : []);
  ctx.stroke();
  ctx.setLineDash([]);
}

/** 道路宽度随缩放级别缩放（以 z15 为基准） */
function roadWidth(base) {
  return Math.max(0.5, base * Math.pow(2, view.zoom - 15));
}

/* --- 标注防重叠：记录已占用矩形，后画的文字自动避让 --- */
let labelRects = [];
function labelFits(x0, y0, x1, y1) {
  for (const r of labelRects) {
    if (x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1]) return false;
  }
  return true;
}
function pushLabel(x0, y0, x1, y1) { labelRects.push([x0, y0, x1, y1]); }

/** 带白色描边的文字（保证在任何底色上可读） */
function textWithHalo(text, x, y, color, font) {
  ctx.font = font;
  ctx.lineWidth = 3;
  ctx.strokeStyle = style.theme === "dark" ? "rgba(20,26,34,0.85)" : "rgba(255,255,255,0.9)";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

/** 主绘制函数 */
function draw() {
  const wp = worldPx();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = style.bg;
  ctx.fillRect(0, 0, view.w, view.h);
  const L = style.layers;
  const casing = style.casing;
  const usingTiles = tiles.enabled;

  if (usingTiles) {
    // 在线瓦片底图：瓦片自带路网、建筑与注记
    drawTiles();
  } else {
  // --- 面状底图层 ---
  if (L.green.on)  for (const f of BASE.layers.green)  if (inView(f)) drawPolygon(f, L.green.color, null, 0);
  if (L.water.on)  for (const f of BASE.layers.water)  if (inView(f)) drawPolygon(f, L.water.color, null, 0);
  if (L.sports.on) for (const f of BASE.layers.sports) if (inView(f)) drawPolygon(f, L.sports.color, null, 0);

  // --- 道路层：描边(casing) + 路面，宽度分三档 ---
  if (L.roadB.on) for (const f of BASE.layers.roadB) if (inView(f)) drawLine(f, casing, roadWidth(3.2) + 1.4, "");
  if (L.roadA.on) for (const f of BASE.layers.roadA) if (inView(f)) drawLine(f, casing, roadWidth(5.2) + 1.8, "");
  if (L.roadB.on) for (const f of BASE.layers.roadB) if (inView(f)) drawLine(f, L.roadB.color, roadWidth(3.2), "");
  if (L.roadA.on) for (const f of BASE.layers.roadA) if (inView(f)) drawLine(f, L.roadA.color, roadWidth(5.2), "");
  if (L.path.on && view.zoom >= 14.8)
    for (const f of BASE.layers.path) if (inView(f)) drawLine(f, L.path.color, roadWidth(1.3), "dash");

  // --- 建筑层（先画淡淡的投影，再画本体，做出轻微立体感；低缩放省掉投影以保证流畅） ---
  if (L.buildings.on) {
    const bs = L.buildingStroke.on ? L.buildingStroke.color : null;
    if (view.zoom >= 15.4) {
      const shadow = style.theme === "dark" ? "rgba(0,0,0,0.3)" : "rgba(150,142,124,0.22)";
      ctx.save();
      ctx.translate(1.5, 1.8);
      for (const f of BASE.layers.buildings) {
        if (!inView(f)) continue;
        drawPolygon(f, shadow, null, 0);
      }
      ctx.restore();
    }
    for (const f of BASE.layers.buildings) {
      if (!inView(f)) continue;
      drawPolygon(f, L.buildings.color, bs, 0.6);
    }
  }

  // --- 文字与兴趣点：统一走防重叠逻辑，建筑优先 ---
  labelRects = [];
  const showLabels = L.labels.on && view.zoom >= 14.6;
  const labelColor = L.labels.color;

  // 1) 建筑名：面积大的优先；低缩放降门槛+缩小字号，高缩放收紧
  if (showLabels) {
    const minArea = view.zoom >= 15.6 ? 300 : 85;
    const fontPx = view.zoom >= 15.6 ? 11.5 : 10;
    const cap = view.zoom >= 15.6 ? 110 : 80;
    const widthFactor = view.zoom >= 15.6 ? 0.8 : 0.5;
    const candidates = [];
    for (const f of BASE.layers.buildings) {
      if (!f.n || !inView(f)) continue;
      const bw = (f.x1 - f.x0) * wp, bh = (f.y1 - f.y0) * wp;
      candidates.push({ f, area: bw * bh });
    }
    candidates.sort((a, b) => b.area - a.area);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    let drawn = 0;
    for (const c of candidates) {
      if (drawn > cap) break;
      const f = c.f;
      if (c.area < minArea) continue;                  // 太小的建筑不标
      const [sx, sy] = toScreen([f.cx, f.cy]);
      const tw = f.n.length * fontPx;
      if ((f.x1 - f.x0) * wp < tw * widthFactor) continue;   // 文字远宽于建筑则不标
      if (!labelFits(sx - tw / 2 - 2, sy - 7, sx + tw / 2 + 2, sy + 7)) continue;
      pushLabel(sx - tw / 2 - 2, sy - 7, sx + tw / 2 + 2, sy + 7);
      textWithHalo(f.n, sx, sy, labelColor, fontPx + "px 'Microsoft YaHei', sans-serif");
      drawn++;
    }
  }

  // 2) 兴趣点：小圆点；文字同样避让
  if (L.pois.on && view.zoom >= 14.8) {
    for (const f of BASE.layers.pois) {
      if (!inView(f, 20)) continue;
      const [sx, sy] = toScreen([f.cx, f.cy]);
      ctx.beginPath();
      ctx.arc(sx, sy, 2.8, 0, Math.PI * 2);
      ctx.fillStyle = L.pois.color; ctx.fill();
      ctx.strokeStyle = style.theme === "dark" ? "#0d1219" : "#ffffff";
      ctx.lineWidth = 1; ctx.stroke();
      if (showLabels && view.zoom >= 15.6 && f.n) {
        const tw = f.n.length * 11;
        const x0 = sx + 5, y0 = sy - 7, x1 = x0 + tw, y1 = sy + 7;
        if (labelFits(x0 - 1, y0, x1 + 1, y1)) {
          pushLabel(x0 - 1, y0, x1 + 1, y1);
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          textWithHalo(f.n, x0, sy, labelColor, "10.5px 'Microsoft YaHei', sans-serif");
        }
      }
    }
  }

  // 3) 道路名：高缩放级别且空间允许时显示，文字沿水平排布
  if (showLabels && view.zoom >= 15.8) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const key of ["roadA", "roadB"]) {
      if (!L[key].on) continue;
      for (const f of BASE.layers[key]) {
        if (!f.n || !inView(f)) continue;
        const [sx, sy] = toScreen([f.cx, f.cy]);
        const tw = f.n.length * 10.5;
        if (!labelFits(sx - tw / 2 - 2, sy - 7, sx + tw / 2 + 2, sy + 7)) continue;
        pushLabel(sx - tw / 2 - 2, sy - 7, sx + tw / 2 + 2, sy + 7);
        textWithHalo(f.n, sx, sy, labelColor, "10.5px 'Microsoft YaHei', sans-serif");
      }
    }
  }

  }   // end else：内嵌离线矢量底图分支

  // --- 校外压暗 + 校园边界：两种底图模式都保留 ---
  if (BASE.boundary && style.dim) {
    const ring = BASE.boundary.m.map(toScreen);
    ctx.beginPath();
    ctx.rect(0, 0, view.w, view.h);
    ctx.moveTo(ring[0][0], ring[0][1]);
    for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i][0], ring[i][1]);
    ctx.closePath();
    ctx.fillStyle = style.theme === "dark" ? "rgba(10,15,20,0.62)" : "rgba(232,229,222,0.72)";
    ctx.fill("evenodd");   // 偶数填充：只压暗校园之外
  }
  if (BASE.boundary) {
    const ring = BASE.boundary.m.map(toScreen);
    ctx.beginPath();
    ctx.moveTo(ring[0][0], ring[0][1]);
    for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i][0], ring[i][1]);
    ctx.closePath();
    ctx.strokeStyle = style.theme === "dark" ? "rgba(120,170,255,0.55)" : "rgba(26,115,232,0.45)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([7, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // 缩得较小时，在校园上方打一个总名字（瓦片底图自带标注，不重复画）
  if (!usingTiles && BASE.campus && view.zoom < 15.4 && style.layers.labels.on) {
    const [sx, sy] = toScreen([BASE.campus.cx, BASE.campus.y0]);
    const tw = 6 * 15;
    if (labelFits(sx - tw / 2, sy + 6, sx + tw / 2, sy + 26)) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      textWithHalo(BASE.boundary ? BASE.boundary.name : "华中农业大学", sx, sy + 16,
        style.theme === "dark" ? "#e8f0ff" : "#1a3d7c", "15px 'Microsoft YaHei', sans-serif");
    }
  }

  // --- 用户要素层：多边形 -> 折线 -> 标记 ---
  for (const f of features) {
    if (f.type === "polygon") drawUserPolygon(f);
  }
  for (const f of features) {
    if (f.type === "line") drawUserLine(f);
  }
  for (const f of features) {
    if (f.type === "marker") drawMarker(f);
  }

  // --- 绘制中的草稿 ---
  drawDraft();

  // --- 选中要素的顶点编辑手柄 ---
  if (selectedId && tool === "select") drawHandles(getFeature(selectedId));

  // --- 比例尺 ---
  drawScaleBar();
}

/** 用户多边形 */
function drawUserPolygon(f) {
  const sel = f.id === selectedId;
  const pts = f.pts.map(toScreen);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = withAlpha(f.style.fill, f.style.fillOpacity);
  ctx.fill();
  ctx.strokeStyle = f.style.stroke;
  ctx.lineWidth = f.style.strokeWidth + (sel ? 1 : 0);
  ctx.lineJoin = "round";
  ctx.setLineDash(f.style.dash === "dash" ? [8, 6] : f.style.dash === "dot" ? [2, 5] : []);
  ctx.stroke();
  ctx.setLineDash([]);
  if (sel) { // 选中高亮外框
    ctx.strokeStyle = "#1a73e8"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  drawFeatureLabel(f, pts);
}

/** 用户折线 */
function drawUserLine(f) {
  const sel = f.id === selectedId;
  const pts = f.pts.map(toScreen);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = f.style.color;
  ctx.lineWidth = f.style.width + (sel ? 1.5 : 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(f.style.dash === "dash" ? [8, 6] : f.style.dash === "dot" ? [2, 5] : []);
  ctx.stroke();
  ctx.setLineDash([]);
  if (sel) {
    ctx.strokeStyle = "#1a73e8"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
  drawFeatureLabel(f, pts);
}

/** 用户标记（水滴形 pin） */
function drawMarker(f) {
  const [sx, sy] = toScreen(f.pts[0]);
  const sel = f.id === selectedId;
  const r = 8;
  ctx.beginPath();
  ctx.moveTo(sx, sy);                        // 底部锚点
  ctx.bezierCurveTo(sx - r, sy - r * 1.2, sx - r, sy - r * 2.1, sx, sy - r * 2.1);
  ctx.bezierCurveTo(sx + r, sy - r * 2.1, sx + r, sy - r * 1.2, sx, sy);
  ctx.fillStyle = f.style.color; ctx.fill();
  ctx.strokeStyle = sel ? "#1a73e8" : "#ffffff";
  ctx.lineWidth = sel ? 2.5 : 1.5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy - r * 1.55, r * 0.42, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff"; ctx.fill();
  if (f.name) {
    ctx.font = "12px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.lineWidth = 3; ctx.strokeStyle = style.bg;
    ctx.strokeText(f.name, sx, sy - r * 2.4);
    ctx.fillStyle = style.theme === "dark" ? "#eee" : "#222";
    ctx.fillText(f.name, sx, sy - r * 2.4);
  }
}

/** 要素名称标注（多边形画在中心，折线画在中点） */
function drawFeatureLabel(f, pts) {
  if (!f.name) return;
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p[0]; cy += p[1]; }
  cx /= pts.length; cy /= pts.length;
  ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = style.bg;
  ctx.strokeText(f.name, cx, cy);
  ctx.fillStyle = style.theme === "dark" ? "#eee" : "#333";
  ctx.fillText(f.name, cx, cy);
}

/** 绘制中的草稿（多边形/折线） */
function drawDraft() {
  if (!draft.length) return;
  const pts = draft.map(toScreen);
  const color = tool === "polygon" ? "#e67e22" : "#2980b9";
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (mouseWorld) {
    const [mx, my] = toScreen(mouseWorld);
    ctx.lineTo(mx, my);
  }
  if (tool === "polygon" && draft.length >= 3) ctx.closePath();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke();
  ctx.setLineDash([]);
  if (tool === "polygon" && draft.length >= 2) {
    ctx.fillStyle = withAlpha(color, 0.15); ctx.fill();
  }
  // 顶点小方点；起点大圆点提示可点击闭合
  for (let i = 0; i < pts.length; i++) {
    ctx.beginPath();
    if (i === 0 && tool === "polygon") {
      ctx.arc(pts[i][0], pts[i][1], 6, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    } else {
      ctx.arc(pts[i][0], pts[i][1], 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
    }
  }
}

/** 选中要素的顶点手柄 + 边中点（加点）手柄 */
function drawHandles(f) {
  if (!f || f.type === "marker") return;
  const pts = f.pts.map(toScreen);
  const closed = f.type === "polygon";
  const edgeCount = closed ? pts.length : pts.length - 1;
  // 边中点：半透明小圆，点击插入顶点
  for (let i = 0; i < edgeCount; i++) {
    const j = (i + 1) % pts.length;
    const mx = (pts[i][0] + pts[j][0]) / 2, my = (pts[i][1] + pts[j][1]) / 2;
    ctx.beginPath();
    ctx.arc(mx, my, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(26,115,232,0.35)"; ctx.fill();
    ctx.strokeStyle = "#1a73e8"; ctx.lineWidth = 1; ctx.stroke();
  }
  // 顶点：白底蓝边方块
  for (const p of pts) {
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#1a73e8"; ctx.lineWidth = 1.5;
    ctx.fillRect(p[0] - 4.5, p[1] - 4.5, 9, 9);
    ctx.strokeRect(p[0] - 4.5, p[1] - 4.5, 9, 9);
  }
}

/** 比例尺 */
function drawScaleBar() {
  // 该纬度下 1 像素对应的米数
  const lat = mercToLat(view.cy);
  const metersPerPx = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, view.zoom);
  let target = 100 * metersPerPx; // 目标 100px
  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000];
  let nice = steps[0];
  for (const s of steps) if (s <= target) nice = s;
  const px = nice / metersPerPx;
  const x = 14, y = view.h - 34;
  ctx.strokeStyle = style.theme === "dark" ? "#ccc" : "#333";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + px, y);
  ctx.moveTo(x, y - 5); ctx.lineTo(x, y);
  ctx.moveTo(x + px, y - 5); ctx.lineTo(x + px, y);
  ctx.stroke();
  ctx.font = "11px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillStyle = style.theme === "dark" ? "#ccc" : "#333";
  ctx.fillText(nice >= 1000 ? (nice / 1000) + " km" : nice + " m", x, y - 7);
}

/* ---------------- 7. 命中检测 ---------------- */
function getFeature(id) { return features.find(f => f.id === id) || null; }

/** 命中用户要素（自上而下：标记 -> 折线 -> 多边形，数组倒序即后画的优先） */
function hitFeature(sx, sy) {
  for (let i = features.length - 1; i >= 0; i--) {
    const f = features[i];
    if (f.type === "marker") {
      const [mx, my] = toScreen(f.pts[0]);
      if (Math.hypot(sx - mx, sy - (my - 10)) < 14) return f;
    }
  }
  for (let i = features.length - 1; i >= 0; i--) {
    const f = features[i];
    if (f.type !== "line") continue;
    const pts = f.pts.map(toScreen);
    for (let j = 0; j < pts.length - 1; j++) {
      if (distToSeg(sx, sy, pts[j][0], pts[j][1], pts[j + 1][0], pts[j + 1][1]) < Math.max(6, f.style.width / 2 + 3)) return f;
    }
  }
  for (let i = features.length - 1; i >= 0; i--) {
    const f = features[i];
    if (f.type !== "polygon") continue;
    const pts = f.pts.map(toScreen);
    if (pointInPoly(sx, sy, pts)) return f;
  }
  return null;
}

/** 命中选中要素的顶点手柄：返回 {kind:'vertex'|'mid', idx} 或 null */
function hitHandle(sx, sy) {
  const f = getFeature(selectedId);
  if (!f || f.type === "marker") return null;
  const pts = f.pts.map(toScreen);
  for (let i = 0; i < pts.length; i++) {
    if (Math.hypot(sx - pts[i][0], sy - pts[i][1]) < 9) return { kind: "vertex", idx: i };
  }
  const closed = f.type === "polygon";
  const edgeCount = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < edgeCount; i++) {
    const j = (i + 1) % pts.length;
    const mx = (pts[i][0] + pts[j][0]) / 2, my = (pts[i][1] + pts[j][1]) / 2;
    if (Math.hypot(sx - mx, sy - my) < 7) return { kind: "mid", idx: i };
  }
  return null;
}

/** 绘制工具下：是否点击在草稿起点附近（用于闭合多边形） */
function nearDraftStart(sx, sy) {
  if (!draft.length) return false;
  const [x0, y0] = toScreen(draft[0]);
  return Math.hypot(sx - x0, sy - y0) < 10;
}

/** 底图建筑 hover 名称提示 */
function baseNameAt(sx, sy) {
  if (!style.layers.buildings.on) return "";
  for (let i = BASE.layers.buildings.length - 1; i >= 0; i--) {
    const f = BASE.layers.buildings[i];
    if (!f.n || !inView(f)) continue;
    const pts = f.m.map(toScreen);
    if (pointInPoly(sx, sy, pts)) return f.n;
  }
  return "";
}

/* ---------------- 8. 交互事件 ---------------- */

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

/** 滚轮缩放：按 delta 大小连续调整，带缓动，锚定鼠标位置 */
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const [sx, sy] = canvasPos(e);
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;          // 行模式
  else if (e.deltaMode === 2) d *= 100;    // 页模式
  d = clamp(d, -180, 180);
  const base = anim ? anim.to.zoom : view.zoom;
  const nz = clamp(base - d * 0.0021, ZOOM_MIN, ZOOM_MAX);
  if (Math.abs(nz - base) < 1e-4) return;
  zoomAround(sx, sy, nz, 170);
  updateStatus(sx, sy);
}, { passive: false });

/** 触屏事件的时间戳：用于忽略触屏后浏览器补发的“合成鼠标事件”，避免一次轻点被当成两次操作 */
let lastTouchTime = 0;

/**
 * 单击语义（鼠标左键 / 手指轻点共用）：按当前工具执行对应动作。
 * 抽成独立函数，鼠标与触屏走同一份逻辑，保证行为一致。
 */
function primaryAction(sx, sy) {
  stopAnim();                 // 用户接管，立刻停止正在进行的动画

  if (tool === "select") {
    // 1) 顶点/中点手柄优先
    const h = hitHandle(sx, sy);
    if (h) {
      const f = getFeature(selectedId);
      if (h.kind === "mid") { // 中点 -> 插入新顶点并立即拖动
        const w = toWorld(sx, sy);
        f.pts.splice(h.idx + 1, 0, w);
        drag = { kind: "vertex", fid: f.id, vidx: h.idx + 1, moved: true };
      } else {
        drag = { kind: "vertex", fid: f.id, vidx: h.idx, moved: false };
      }
      draw();
      return;
    }
    // 2) 命中标记：可拖动
    const hit = hitFeature(sx, sy);
    if (hit) {
      selectFeature(hit.id);
      if (hit.type === "marker") drag = { kind: "marker", fid: hit.id, moved: false };
      return;
    }
    // 3) 空白：取消选中 + 进入平移
    selectFeature(null);
    drag = { kind: "pan", sx, sy, ox: view.cx, oy: view.cy, moved: false, vx: 0, vy: 0, last: null };
    return;
  }

  if (tool === "marker") {
    const w = toWorld(sx, sy);
    const f = { id: uid(), type: "marker", name: "", note: "", pts: [w], style: defaultStyle("marker") };
    features.push(f);
    save();
    selectFeature(f.id);
    setTool("select"); // 放完一个标记自动切回选择工具，方便立即编辑
    draw();
    return;
  }

  if (tool === "polygon" || tool === "line") {
    // 多边形：点击起点且顶点数足够 -> 闭合
    if (tool === "polygon" && draft.length >= 3 && nearDraftStart(sx, sy)) {
      finishDraft();
      return;
    }
    draft.push(toWorld(sx, sy));
    draw();
    return;
  }

  // pan 工具：拖拽平移
  drag = { kind: "pan", sx, sy, ox: view.cx, oy: view.cy, moved: false, vx: 0, vy: 0, last: null };
}

canvas.addEventListener("mousedown", e => {
  if (e.button === 2) return;                    // 右键走 contextmenu
  if (Date.now() - lastTouchTime < 600) return;  // 触屏后补发的合成鼠标事件，忽略
  const [sx, sy] = canvasPos(e);
  primaryAction(sx, sy);
});

canvas.addEventListener("mousemove", e => {
  const [sx, sy] = canvasPos(e);
  mouseWorld = toWorld(sx, sy);

  if (drag) {
    if (drag.kind === "pan") {
      const wp = worldPx();
      view.cx = drag.ox - (sx - drag.sx) / wp;
      view.cy = drag.oy - (sy - drag.sy) / wp;
      if (Math.hypot(sx - drag.sx, sy - drag.sy) > 3) drag.moved = true;
      // 记录速度用于松手后的惯性滑动（指数平滑，避免抖动）
      const now = performance.now();
      if (drag.last) {
        const dt = Math.max(1, now - drag.last.t);
        drag.vx = (sx - drag.last.x) / dt * 0.75 + (drag.vx || 0) * 0.25;
        drag.vy = (sy - drag.last.y) / dt * 0.75 + (drag.vy || 0) * 0.25;
      }
      drag.last = { t: now, x: sx, y: sy };
      draw();
    } else if (drag.kind === "marker") {
      const f = getFeature(drag.fid);
      if (f) { f.pts[0] = mouseWorld; drag.moved = true; draw(); }
    } else if (drag.kind === "vertex") {
      const f = getFeature(drag.fid);
      if (f) { f.pts[drag.vidx] = mouseWorld; drag.moved = true; draw(); }
    }
  } else {
    // 悬停反馈
    let need = false;
    if (tool === "select") {
      const hit = hitFeature(sx, sy);
      const nid = hit ? hit.id : null;
      if (nid !== hoverId) { hoverId = nid; need = true; }
      canvas.style.cursor = hit ? "pointer" : "default";
      const bn = hit ? (hit.name || typeName(hit.type)) : baseNameAt(sx, sy);
      if (bn !== hoverBaseName) { hoverBaseName = bn; need = true; }
    } else if (tool === "polygon" || tool === "line") {
      canvas.style.cursor = "crosshair";
      need = draft.length > 0; // 更新预览线
    } else if (tool === "marker") {
      canvas.style.cursor = "crosshair";
    } else {
      canvas.style.cursor = "grab";
      const bn = baseNameAt(sx, sy);
      if (bn !== hoverBaseName) { hoverBaseName = bn; need = true; }
    }
    if (need) { draw(); }
  }
  updateStatus(sx, sy);
});

canvas.addEventListener("mouseup", () => {
  if (drag && (drag.kind === "marker" || drag.kind === "vertex") && drag.moved) save();
  if (drag && drag.kind === "pan" && drag.moved) {
    // 松手后惯性滑行：速度越大滑得越远，ease-out 逐渐停下
    const speed = Math.hypot(drag.vx || 0, drag.vy || 0);
    if (speed > 0.22) {
      const wp = worldPx();
      const glide = 200, decay = 0.45;
      animateView({
        cx: view.cx - (drag.vx * glide * decay) / wp,
        cy: view.cy - (drag.vy * glide * decay) / wp,
        zoom: view.zoom
      }, glide * 1.7, "out");
    } else save();
  }
  drag = null;
});
canvas.addEventListener("mouseleave", () => { mouseWorld = null; drag = null; draw(); });

/** 双击：绘制工具下=完成绘制；其它=平滑放大 */
canvas.addEventListener("dblclick", e => {
  e.preventDefault();
  const [sx, sy] = canvasPos(e);
  if (tool === "polygon" || tool === "line") { finishDraft(); return; }
  zoomAround(sx, sy, clamp(view.zoom + 1, ZOOM_MIN, ZOOM_MAX), 320, "inout");
});

/** 右键：删除顶点（选择工具 + 选中多边形/折线时） */
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (tool !== "select") return;
  const [sx, sy] = canvasPos(e);
  const h = hitHandle(sx, sy);
  if (h && h.kind === "vertex") {
    const f = getFeature(selectedId);
    const minPts = f.type === "polygon" ? 3 : 2;
    if (f.pts.length > minPts) {
      f.pts.splice(h.idx, 1);
      save(); draw();
      setStatus(`已删除顶点（剩余 ${f.pts.length} 个）`);
    } else {
      setStatus(`${typeName(f.type)}至少保留 ${minPts} 个顶点`);
    }
  }
});

/* ---------------- 触屏支持（手机 / 平板 / 微信里“在浏览器打开”） ----------------
 * 单指拖动 = 平移（松手带惯性）；双指捏合 = 缩放（锚定双指中点，跟手不飘）；
 * 轻点 = 当前工具的一次单击；双击 = 放大一级（绘制工具下双击 = 结束绘制）。
 * 与鼠标共用 primaryAction，保证两种输入行为一致。 */
let touch = null;                       // { mode:'pan' | 'pinch', ... }
let lastTap = { t: 0, x: 0, y: 0 };

function touchPos(t) {
  const r = canvas.getBoundingClientRect();
  return [t.clientX - r.left, t.clientY - r.top];
}

/** 以屏幕点为锚点直接缩放（不做动画，手指跟手感更好） */
function pinchTo(nz, mx, my) {
  const wp0 = worldPx();
  const wx = view.cx + (mx - view.w / 2) / wp0;
  const wy = view.cy + (my - view.h / 2) / wp0;
  view.zoom = clamp(nz, ZOOM_MIN, ZOOM_MAX);
  const wp1 = worldPx();
  view.cx = wx - (mx - view.w / 2) / wp1;
  view.cy = wy - (my - view.h / 2) / wp1;
  draw();
}

canvas.addEventListener("touchstart", e => {
  lastTouchTime = Date.now();
  if (e.touches.length >= 2) e.preventDefault();   // 双指时阻止系统缩放页面
  stopAnim();
  if (e.touches.length === 1) {
    const [sx, sy] = touchPos(e.touches[0]);
    touch = { mode: "pan", sx, sy, ox: view.cx, oy: view.cy, moved: false,
              vx: 0, vy: 0, last: null, t0: Date.now() };
  } else if (e.touches.length >= 2) {
    const [ax, ay] = touchPos(e.touches[0]);
    const [bx, by] = touchPos(e.touches[1]);
    touch = { mode: "pinch", d0: Math.max(1, Math.hypot(ax - bx, ay - by)), z0: view.zoom };
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  lastTouchTime = Date.now();
  if (!touch) return;
  e.preventDefault();
  if (touch.mode === "pan" && e.touches.length === 1) {
    const [sx, sy] = touchPos(e.touches[0]);
    const wp = worldPx();
    view.cx = touch.ox - (sx - touch.sx) / wp;
    view.cy = touch.oy - (sy - touch.sy) / wp;
    if (Math.hypot(sx - touch.sx, sy - touch.sy) > 6) touch.moved = true;
    const now = performance.now();                 // 记录速度用于松手惯性
    if (touch.last) {
      const dt = Math.max(1, now - touch.last.t);
      touch.vx = (sx - touch.last.x) / dt * 0.75 + (touch.vx || 0) * 0.25;
      touch.vy = (sy - touch.last.y) / dt * 0.75 + (touch.vy || 0) * 0.25;
    }
    touch.last = { t: now, x: sx, y: sy };
    mouseWorld = toWorld(sx, sy);
    updateStatus(sx, sy);
    draw();
  } else if (touch.mode === "pinch" && e.touches.length >= 2) {
    const [ax, ay] = touchPos(e.touches[0]);
    const [bx, by] = touchPos(e.touches[1]);
    const d = Math.hypot(ax - bx, ay - by);
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    pinchTo(touch.z0 + Math.log2(Math.max(1e-3, d / touch.d0)), mx, my);
    updateStatus(mx, my);
  }
}, { passive: false });

canvas.addEventListener("touchend", e => {
  lastTouchTime = Date.now();
  if (e.touches.length > 0) return;                // 双指变单指，交给下一轮 touchstart
  if (!touch) return;
  if (touch.mode === "pan") {
    if (!touch.moved && Date.now() - touch.t0 < 320) {
      const now = Date.now();
      const isDouble = now - lastTap.t < 300 &&
                       Math.hypot(touch.sx - lastTap.x, touch.sy - lastTap.y) < 44;
      if (isDouble && (tool === "polygon" || tool === "line")) {
        lastTap.t = 0;
        finishDraft();                                               // 绘制中：双击 = 结束
      } else if (isDouble && (tool === "pan" || tool === "select")) {
        lastTap.t = 0;
        zoomAround(touch.sx, touch.sy, clamp(view.zoom + 1, ZOOM_MIN, ZOOM_MAX), 320, "inout");
      } else {
        // 标记 / 绘制工具下的连点要各自生效，不能吞掉第二次点击
        lastTap = { t: now, x: touch.sx, y: touch.sy };
        primaryAction(touch.sx, touch.sy);
        if (drag && drag.kind === "pan" && !drag.moved) drag = null;   // 轻点不是拖动
      }
    } else if (touch.moved) {
      const speed = Math.hypot(touch.vx || 0, touch.vy || 0);
      if (speed > 0.32) {                          // 惯性滑行（触屏手感略强于鼠标）
        const wp = worldPx(), glide = 260, decay = 0.5;
        animateView({
          cx: view.cx - (touch.vx * glide * decay) / wp,
          cy: view.cy - (touch.vy * glide * decay) / wp,
          zoom: view.zoom
        }, glide * 1.7, "out");
      } else save();
    }
  }
  touch = null;
}, { passive: false });

canvas.addEventListener("touchcancel", () => { touch = null; }, { passive: false });

/** 键盘：Esc 取消 / Enter 完成 / Backspace 撤销顶点 / Delete 删除要素 */
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.key === "Escape") {
    if (draft.length) { draft = []; draw(); setStatus("已取消绘制"); }
    else selectFeature(null);
  } else if (e.key === "Enter" && (tool === "polygon" || tool === "line")) {
    finishDraft();
  } else if (e.key === "Backspace" && draft.length) {
    draft.pop(); draw();
  } else if ((e.key === "Delete" || e.key === "Backspace") && selectedId && !draft.length && tool === "select") {
    deleteFeature(selectedId);
  }
});

/* ---------------- 9. 要素操作 ---------------- */

function typeName(t) { return t === "marker" ? "标记" : t === "polygon" ? "区域" : "路线"; }

/** 完成草稿 -> 生成要素 */
function finishDraft() {
  const minPts = tool === "polygon" ? 3 : 2;
  if (draft.length < minPts) {
    setStatus(`${typeName(tool === "polygon" ? "polygon" : "line")}至少需要 ${minPts} 个顶点`);
    return;
  }
  const f = {
    id: uid(), type: tool, name: "", note: "",
    pts: draft.slice(), style: defaultStyle(tool)
  };
  features.push(f);
  draft = [];
  save();
  selectFeature(f.id);
  setTool("select");
  setStatus(`${typeName(f.type)}已创建，可在右侧面板编辑名称与样式`);
}

/** 选中要素（联动右侧面板） */
function selectFeature(id) {
  selectedId = id;
  hoverId = null;
  renderFeaturePanel();
  draw();
  if (id && isNarrow()) openDrawer();   // 手机：选中后自动拉出编辑面板，否则改不了名字/样式
}

/** 删除要素 */
function deleteFeature(id) {
  const f = getFeature(id);
  if (!f) return;
  if (!confirm(`确定删除这个${typeName(f.type)}${f.name ? "「" + f.name + "」" : ""}吗？`)) return;
  features = features.filter(x => x.id !== id);
  if (selectedId === id) selectedId = null;
  save(); renderFeaturePanel(); draw();
  setStatus("已删除");
}

/* ---------------- 10. 持久化（localStorage） ---------------- */
const LS_KEY = "hzau-offline-map-v1";
let saveTimer = null;

/** 防抖保存 */
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        features, style,
        basemap: tiles.enabled ? "tiles" : "vector",
        view: { cx: view.cx, cy: view.cy, zoom: view.zoom }
      }));
    } catch (err) {
      setStatus("保存失败：" + err.message);
    }
    updateDataStats();
  }, 250);
}

/** 启动时恢复；返回是否恢复过视图位置 */
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (Array.isArray(d.features)) features = d.features;
    if (d.style) applyStyleState(d.style);
    if (d.basemap === "tiles") tiles.enabled = true;
    if (d.view) {
      view.cx = d.view.cx; view.cy = d.view.cy;
      view.zoom = clamp(d.view.zoom, ZOOM_MIN, ZOOM_MAX);
      return true;
    }
  } catch (err) { /* 数据损坏则忽略，使用默认 */ }
  return false;
}

/** 把保存的样式状态合并进当前 style（容忍旧版本缺字段 / 旧版 road1·road2 命名） */
function applyStyleState(s) {
  if (s.theme && THEMES[s.theme]) style.theme = s.theme;
  if (s.bg) style.bg = s.bg;
  if (s.casing) style.casing = s.casing;
  if (s.layers) {
    for (const k of Object.keys(style.layers)) {
      if (s.layers[k]) {
        if (typeof s.layers[k].on === "boolean") style.layers[k].on = s.layers[k].on;
        if (s.layers[k].color) style.layers[k].color = s.layers[k].color;
      }
    }
    // 兼容 1.0 版存档：road1/road2 -> roadA/roadB
    if (s.layers.road1 && s.layers.road2 && !s.layers.roadA) {
      style.layers.roadA.on = s.layers.road1.on; style.layers.roadA.color = s.layers.road1.color;
      style.layers.roadB.on = s.layers.road2.on; style.layers.roadB.color = s.layers.road2.color;
    }
  }
}

/* ---------------- 11. 导入 / 导出 ---------------- */

/** 导出：墨卡托坐标转回经纬度，通用性更好 */
function exportData() {
  const out = {
    app: "hzau-offline-map", version: 1, exportedAt: new Date().toISOString(),
    style,
    features: features.map(f => ({
      id: f.id, type: f.type, name: f.name, note: f.note, style: f.style,
      coords: f.pts.map(p => [+mercToLon(p[0]).toFixed(7), +mercToLat(p[1]).toFixed(7)])
    }))
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hzau-map-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("已导出 hzau-map-data.json");
}

/** 导入：校验结构，经纬度转墨卡托 */
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.features)) throw new Error("文件中没有 features 数组");
      const imported = [];
      for (const f of d.features) {
        if (!["marker", "polygon", "line"].includes(f.type)) continue;
        if (!Array.isArray(f.coords) || !f.coords.length) continue;
        imported.push({
          id: f.id || uid(), type: f.type,
          name: f.name || "", note: f.note || "",
          style: Object.assign(defaultStyle(f.type), f.style || {}),
          pts: f.coords.map(c => [mercX(c[0]), mercY(c[1])])
        });
      }
      if (!confirm(`将导入 ${imported.length} 个要素（会替换当前 ${features.length} 个），继续？`)) return;
      features = imported;
      if (d.style) applyStyleState(d.style);
      selectedId = null;
      save(); buildStylePanel(); renderFeaturePanel(); draw();
      setStatus(`导入成功：${imported.length} 个要素`);
    } catch (err) {
      alert("导入失败：" + err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------------- 12. UI：工具栏 / 面板 / 状态栏 ---------------- */

function setTool(t) {
  tool = t;
  draft = [];
  document.querySelectorAll("#toolbar button[data-tool]").forEach(b => {
    b.classList.toggle("active", b.dataset.tool === t);
  });
  canvas.style.cursor = t === "pan" ? "grab" : t === "select" ? "default" : "crosshair";
  setStatus();
  draw();
}

function setStatus(extra) {
  const el = document.getElementById("status-tool");
  el.textContent = extra || TOOL_HINTS[tool] || "";
}

function updateStatus(sx, sy) {
  const w = toWorld(sx, sy);
  document.getElementById("status-pos").textContent =
    `${mercToLon(w[0]).toFixed(6)}, ${mercToLat(w[1]).toFixed(6)}`;
  document.getElementById("status-zoom").textContent = "z" + view.zoom.toFixed(1);
  const info = hoverBaseName ? ` | ${hoverBaseName}` : "";
  const el = document.getElementById("status-hover");
  el.textContent = info;
}

/* --- 工具栏按钮 --- */
document.querySelectorAll("#toolbar button[data-tool]").forEach(b => {
  b.addEventListener("click", () => setTool(b.dataset.tool));
});

/* --- 顶栏按钮 --- */
/* --- 顶栏与地图浮动控件（均带缓动动画） --- */
function zoomBy(delta) {
  zoomAround(view.w / 2, view.h / 2, clamp((anim ? anim.to.zoom : view.zoom) + delta, ZOOM_MIN, ZOOM_MAX), 280, "inout");
}
document.getElementById("btn-zoom-in").addEventListener("click", () => zoomBy(0.9));
document.getElementById("btn-zoom-out").addEventListener("click", () => zoomBy(-0.9));
document.getElementById("btn-fit").addEventListener("click", () => fitCampus());
document.getElementById("mc-in").addEventListener("click", () => zoomBy(0.9));
document.getElementById("mc-out").addEventListener("click", () => zoomBy(-0.9));
document.getElementById("mc-fit").addEventListener("click", () => fitCampus());

/* --- 窄屏抽屉：手机上把侧栏拉出来（样式 / 要素 / 数据） --- */
function isNarrow() { return window.matchMedia("(max-width: 760px)").matches; }
function openDrawer() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("drawer-mask").classList.add("open");
}
function closeDrawer() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("drawer-mask").classList.remove("open");
}
document.getElementById("btn-panel").addEventListener("click", () => {
  if (document.getElementById("sidebar").classList.contains("open")) closeDrawer();
  else openDrawer();
});
document.getElementById("drawer-mask").addEventListener("click", closeDrawer);
window.addEventListener("resize", () => { if (!isNarrow()) closeDrawer(); });

/* --- 侧栏 Tab 切换 --- */
document.querySelectorAll("#sidebar .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#sidebar .tab").forEach(t => t.classList.toggle("active", t === tab));
    document.querySelectorAll("#sidebar .panel").forEach(p =>
      p.classList.toggle("active", p.id === "panel-" + tab.dataset.tab));
  });
});
function showTab(name) {
  document.querySelectorAll("#sidebar .tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll("#sidebar .panel").forEach(p =>
    p.classList.toggle("active", p.id === "panel-" + name));
}

/* --- 样式面板：图层开关 + 颜色 + 主题 --- */
function buildStylePanel() {
  const box = document.getElementById("panel-style-body");
  box.innerHTML = "";

  const sectA = document.createElement("div");
  sectA.className = "sect"; sectA.textContent = "底图与配色";
  box.appendChild(sectA);

  // 底图来源
  const themeRow = document.createElement("div");
  themeRow.className = "row";
  themeRow.innerHTML = `<label>主题</label>`;
  const sel = document.createElement("select");
  for (const k of Object.keys(THEMES)) {
    const o = document.createElement("option");
    o.value = k; o.textContent = THEMES[k].name;
    if (style.theme === k) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener("change", () => applyTheme(sel.value));
  themeRow.appendChild(sel);

  // 底图来源
  const bmRow = document.createElement("div");
  bmRow.className = "row";
  bmRow.innerHTML = `<label>底图</label>`;
  const bmSel = document.createElement("select");
  [["vector", "内嵌离线矢量（可自定义配色）"], ["tiles", "在线 OSM 瓦片（需联网）"]].forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    if ((tiles.enabled ? "tiles" : "vector") === v) o.selected = true;
    bmSel.appendChild(o);
  });
  bmSel.addEventListener("change", () => setBasemap(bmSel.value));
  bmRow.appendChild(bmSel);
  box.appendChild(bmRow);

  // 主题选择
  box.appendChild(themeRow);

  // 背景色 / 道路描边色 / 校外压暗
  box.appendChild(makeColorRow("背景色", style.bg, v => { style.bg = v; save(); draw(); }));
  box.appendChild(makeColorRow("道路描边", style.casing, v => { style.casing = v; save(); draw(); }));
  box.appendChild(makeDimRow());

  // 每个图层：开关 + 颜色
  const sectB = document.createElement("div");
  sectB.className = "sect"; sectB.textContent = "图层显示与配色";
  box.appendChild(sectB);
  for (const k of Object.keys(style.layers)) {
    const lay = style.layers[k];
    const row = document.createElement("div");
    row.className = "row";
    const chk = document.createElement("input");
    chk.type = "checkbox"; chk.checked = lay.on;
    chk.addEventListener("change", () => { lay.on = chk.checked; save(); draw(); });
    const lab = document.createElement("span");
    lab.className = "layer-name"; lab.textContent = lay.label;
    const color = document.createElement("input");
    color.type = "color"; color.value = lay.color;
    color.addEventListener("input", () => { lay.color = color.value; save(); draw(); });
    row.appendChild(chk); row.appendChild(lab); row.appendChild(color);
    box.appendChild(row);
  }

  const tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = "样式修改即时生效并自动保存，重新打开页面后保持。";
  box.appendChild(tip);
}

/** 校外压暗开关（单独一行，便于找到） */
function makeDimRow() {
  const row = document.createElement("div");
  row.className = "row";
  const chk = document.createElement("input");
  chk.type = "checkbox"; chk.checked = !!style.dim;
  chk.addEventListener("change", () => { style.dim = chk.checked; save(); draw(); });
  const lab = document.createElement("span");
  lab.className = "layer-name"; lab.textContent = "校外区域压暗（突出校园）";
  row.appendChild(chk); row.appendChild(lab);
  return row;
}

function makeColorRow(label, value, onChange) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("span");
  lab.className = "layer-name"; lab.textContent = label;
  const color = document.createElement("input");
  color.type = "color"; color.value = value;
  color.addEventListener("input", () => onChange(color.value));
  row.appendChild(lab); row.appendChild(color);
  return row;
}

/** 应用预设主题（重置所有图层色，保留开关状态） */
function applyTheme(k) {
  const t = THEMES[k];
  style.theme = k;
  style.bg = t.bg;
  style.casing = t.casing;
  for (const key of Object.keys(t.layers)) {
    if (style.layers[key]) style.layers[key].color = t.layers[key];
  }
  save(); buildStylePanel(); draw();
}

/* --- 要素编辑面板 --- */
function renderFeaturePanel() {
  const box = document.getElementById("panel-feature-body");
  const f = getFeature(selectedId);
  if (!f) {
    box.innerHTML = `<div class="tip">未选中要素。<br>用「选择」工具点击地图上的标记 / 区域 / 路线即可编辑；<br>或用左侧工具创建新要素。</div>`;
    return;
  }
  showTab("feature");
  box.innerHTML = "";

  // 类型与顶点数
  const head = document.createElement("div");
  head.className = "row";
  head.innerHTML = `<span class="badge">${typeName(f.type)}</span><span class="muted">${f.pts.length} 个顶点</span>`;
  box.appendChild(head);

  // 名称
  box.appendChild(makeField("名称", "input", f.name, v => { f.name = v; save(); draw(); }));
  // 备注
  box.appendChild(makeField("备注", "textarea", f.note, v => { f.note = v; save(); }));

  // 样式字段
  if (f.type === "marker") {
    box.appendChild(makeColorRow("颜色", f.style.color, v => { f.style.color = v; save(); draw(); }));
  } else if (f.type === "polygon") {
    box.appendChild(makeColorRow("填充色", f.style.fill, v => { f.style.fill = v; save(); draw(); }));
    box.appendChild(makeRangeRow("填充透明度", f.style.fillOpacity, 0, 1, 0.05, v => { f.style.fillOpacity = v; save(); draw(); }));
    box.appendChild(makeColorRow("边框色", f.style.stroke, v => { f.style.stroke = v; save(); draw(); }));
    box.appendChild(makeRangeRow("边框宽度", f.style.strokeWidth, 0.5, 10, 0.5, v => { f.style.strokeWidth = v; save(); draw(); }));
    box.appendChild(makeDashRow(f.style.dash, v => { f.style.dash = v; save(); draw(); }));
  } else {
    box.appendChild(makeColorRow("线条颜色", f.style.color, v => { f.style.color = v; save(); draw(); }));
    box.appendChild(makeRangeRow("线条宽度", f.style.width, 1, 12, 0.5, v => { f.style.width = v; save(); draw(); }));
    box.appendChild(makeDashRow(f.style.dash, v => { f.style.dash = v; save(); draw(); }));
  }

  // 操作按钮
  const ops = document.createElement("div");
  ops.className = "row ops";
  const btnFly = document.createElement("button");
  btnFly.textContent = "飞到此处";
  btnFly.addEventListener("click", () => {
    let cx = 0, cy = 0;
    for (const p of f.pts) { cx += p[0]; cy += p[1]; }
    view.cx = cx / f.pts.length; view.cy = cy / f.pts.length;
    view.zoom = clamp(view.zoom + 0.5, ZOOM_MIN, ZOOM_MAX);
    draw(); save();
  });
  const btnDel = document.createElement("button");
  btnDel.textContent = "删除要素"; btnDel.className = "danger";
  btnDel.addEventListener("click", () => deleteFeature(f.id));
  ops.appendChild(btnFly); ops.appendChild(btnDel);
  box.appendChild(ops);

  const tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = f.type === "marker"
    ? "在地图上直接拖动标记可移动位置。"
    : "拖动白色方块移动顶点；点击边中点蓝点插入顶点；右键顶点删除。";
  box.appendChild(tip);
}

function makeField(label, kind, value, onChange) {
  const row = document.createElement("div");
  row.className = "row col";
  const lab = document.createElement("label");
  lab.textContent = label;
  const inp = document.createElement(kind === "textarea" ? "textarea" : "input");
  inp.value = value || "";
  if (kind === "textarea") inp.rows = 3;
  inp.addEventListener("input", () => onChange(inp.value));
  row.appendChild(lab); row.appendChild(inp);
  return row;
}

function makeRangeRow(label, value, min, max, step, onChange) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("span");
  lab.className = "layer-name"; lab.textContent = label;
  const range = document.createElement("input");
  range.type = "range"; range.min = min; range.max = max; range.step = step; range.value = value;
  const val = document.createElement("span");
  val.className = "muted"; val.textContent = value;
  range.addEventListener("input", () => { val.textContent = range.value; onChange(parseFloat(range.value)); });
  row.appendChild(lab); row.appendChild(range); row.appendChild(val);
  return row;
}

function makeDashRow(value, onChange) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("span");
  lab.className = "layer-name"; lab.textContent = "线型";
  const sel = document.createElement("select");
  [["", "实线"], ["dash", "虚线"], ["dot", "点线"]].forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    if (value === v) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => onChange(sel.value));
  row.appendChild(lab); row.appendChild(sel);
  return row;
}

/* --- 数据面板 --- */
function buildDataPanel() {
  document.getElementById("btn-export").addEventListener("click", exportData);
  document.getElementById("btn-import").addEventListener("click", () =>
    document.getElementById("file-import").click());
  document.getElementById("file-import").addEventListener("change", e => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (!features.length) { setStatus("当前没有要素"); return; }
    if (!confirm(`确定清空全部 ${features.length} 个要素吗？此操作不可撤销！`)) return;
    features = []; selectedId = null;
    save(); renderFeaturePanel(); draw();
    setStatus("已清空全部要素");
  });
  updateDataStats();
}

function updateDataStats() {
  const cnt = { marker: 0, polygon: 0, line: 0 };
  for (const f of features) cnt[f.type]++;
  document.getElementById("data-stats").textContent =
    `标记 ${cnt.marker} · 区域 ${cnt.polygon} · 路线 ${cnt.line}`;
}

/* ---------------- 13. 启动 ---------------- */
const hadSavedView = load();
buildStylePanel();
buildDataPanel();
renderFeaturePanel();
setTool("pan");
resize();
let didFit = hadSavedView;
if (!didFit) { didFit = true; fitCampus(); }   // 首次打开自动框住整个校园

/* 标记脚本已成功执行：与“脚本被环境拦截”（见 template.html 的 noscript 提示）区分开 */
window.__hzau.js = true;

/* 首帧兜底：WebView 首帧可能拿不到正确尺寸，稍后再校准一次并重新贴合校园 */
window.addEventListener("load", () => {
  resize();
  if (!didFit) { didFit = true; fitCampus(); }
});
setTimeout(() => {
  resize();
  if (!didFit) { didFit = true; fitCampus(); }
}, 400);
</script>
